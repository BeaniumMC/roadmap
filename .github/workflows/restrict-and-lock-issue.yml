name: Restrict issue creators and lock issue

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read

jobs:
  restrict:
    runs-on: ubuntu-latest
    steps:
      - name: Check if creator has write access
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking permissions for $ACTOR on $REPO"

          perm=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/collaborators/$ACTOR/permission \
            | jq -r '.permission')

          echo "Permission level: $perm"

          if [[ "$perm" == "write" || "$perm" == "maintain" || "$perm" == "admin" ]]; then
            echo "has_write=true" >> $GITHUB_OUTPUT
          else
            echo "has_write=false" >> $GITHUB_OUTPUT
          fi

      - name: Close issues from non-writers
        if: steps.check.outputs.has_write == 'false'
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            -R "$GITHUB_REPOSITORY" \
            -c "Only repository maintainers can create issues."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lock:
    needs: restrict
    runs-on: ubuntu-latest
    steps:
      - name: Lock issue
        run: |
          gh issue lock "${{ github.event.issue.number }}" -R "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}