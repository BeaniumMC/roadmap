name: Lock issues automatically

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Lock issue
        run: gh issue lock "$GITHUB_EVENT_ISSUE_NUMBER" -R "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
